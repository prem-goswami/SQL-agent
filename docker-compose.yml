services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sqlagent
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: chinook
    ports:
      - "5433:5432"
    volumes:
      - chinookdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent -d chinook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chinookdata:
